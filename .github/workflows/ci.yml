name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install pytest
      - name: Compile check
        run: python -m py_compile denzyx.py dscli.py auto-denz.py
      - name: Import + schema check
        run: python -c "import dscli; assert len(dscli.TOOLS) >= 15; assert set(dscli.TOOL_IMPL) <= {t['function']['name'] for t in dscli.TOOLS}"
      - name: Run tests
        run: python -m pytest -q tests/
