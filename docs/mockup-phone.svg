<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b5bf0"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="porb" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.2"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- phone body -->
  <rect x="100" y="20" width="400" height="680" rx="48" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="116" y="36" width="368" height="648" rx="38" fill="url(#pbg)"/>
  <rect x="116" y="36" width="368" height="648" rx="38" fill="url(#porb)"/>
  <!-- notch -->
  <rect x="256" y="50" width="88" height="24" rx="12" fill="#0d1117"/>

  <!-- appbar -->
  <text x="300" y="112" fill="#e9edf7" font-size="19" font-weight="700" text-anchor="middle">denzyx AI</text>
  <circle cx="452" cy="106" r="4.5" fill="#22c55e"/>
  <text x="462" y="109" fill="#22c55e" font-size="9">online</text>

  <!-- welcome logo -->
  <image href="https://raw.githubusercontent.com/radenz06/denzyxai/main/docs/logo.jpg" x="262" y="140" width="76" height="76" rx="22"/>
  <text x="300" y="246" fill="#e9edf7" font-size="22" font-weight="700" text-anchor="middle">Halo, Raden!</text>
  <text x="300" y="272" fill="#8b95ad" font-size="12.5" text-anchor="middle">Apa yang bisa saya bantu?</text>

  <!-- cards -->
  <rect x="150" y="296" width="136" height="70" rx="14" fill="#181f38" stroke="#4f7cff" stroke-opacity="0.2"/>
  <text x="166" y="320" font-size="16">💬</text>
  <text x="166" y="344" fill="#c3cde8" font-size="11">cara kerja</text>
  <text x="166" y="359" fill="#c3cde8" font-size="11">denzyx AI</text>
  <rect x="314" y="296" width="136" height="70" rx="14" fill="#181f38" stroke="#4f7cff" stroke-opacity="0.2"/>
  <text x="330" y="320" font-size="16">✨</text>
  <text x="330" y="344" fill="#c3cde8" font-size="11">puisi pendek</text>

  <!-- user bubble -->
  <rect x="240" y="398" width="216" height="52" rx="16" fill="url(#ubg)"/>
  <text x="260" y="422" fill="#fff" font-size="13">Denz, cek keamanan</text>
  <text x="260" y="441" fill="#fff" font-size="13">website gua 🔍</text>

  <!-- ai -->
  <image href="https://raw.githubusercontent.com/radenz06/denzyxai/main/docs/logo.jpg" x="150" y="474" width="32" height="32" rx="10"/>
  <rect x="192" y="474" width="250" height="58" rx="16" fill="#182140" stroke="#4f7cff" stroke-opacity="0.2"/>
  <text x="210" y="495" fill="#9fb0d8" font-size="10.5">denzyx AI</text>
  <text x="210" y="514" fill="#e9edf7" font-size="13">Gas! Mulai recon dulu —</text>
  <text x="210" y="530" fill="#e9edf7" font-size="13">kasih domain-nya ya 👊</text>

  <!-- composer -->
  <rect x="140" y="596" width="320" height="52" rx="26" fill="#161d34" stroke="#4f7cff" stroke-opacity="0.35"/>
  <text x="166" y="626" fill="#5b6b8f" font-size="13">Tanya apa saja...</text>
  <circle cx="426" cy="622" r="18" fill="url(#abg)"/>
  <text x="426" y="628" fill="#fff" font-size="13" text-anchor="middle">➤</text>
  <rect x="156" y="590" width="40" height="20" rx="10" fill="#4f7cff" fill-opacity="0.12"/>
  <text x="176" y="604" fill="#9fb0d8" font-size="9" text-anchor="middle">⚙ AI</text>
  <rect x="200" y="590" width="66" height="20" rx="10" fill="#4f7cff" fill-opacity="0.12"/>
  <text x="233" y="604" fill="#9fb0d8" font-size="9" text-anchor="middle">+ Chat Baru</text>
</svg>