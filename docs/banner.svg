<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/><stop offset="0.5" stop-color="#0d1326"/><stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="ht" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2ff"/><stop offset="0.5" stop-color="#b79aff"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="horb1" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.22"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horb2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.2"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.15"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="hglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="380" fill="url(#hb)"/>
  <rect width="1280" height="380" fill="url(#horb1)"/>
  <rect width="1280" height="380" fill="url(#horb2)"/>
  <!-- grid -->
  <g stroke="#4f7cff" stroke-opacity="0.05">
    <path d="M0 190 H1280 M0 285 H1280 M0 95 H1280" stroke-width="1"/>
    <path d="M160 0 V380 M320 0 V380 M480 0 V380 M640 0 V380 M800 0 V380 M960 0 V380 M1120 0 V380" stroke-width="1"/>
  </g>

  <image href="https://raw.githubusercontent.com/radenz06/denzyxai/main/docs/logo.jpg" x="560" y="44" width="96" height="96" rx="28"/>
  <text x="640" y="190" font-size="54" font-weight="800" fill="url(#ht)" text-anchor="middle" filter="url(#hglow)">denzyx AI</text>
  <text x="640" y="228" fill="#c3cde8" font-size="19" text-anchor="middle">Asisten AI all-in-one — terminal TUI, web chat, bot Telegram, auto-reply 24 jam</text>

  <!-- chips -->
  <rect x="370" y="260" width="150" height="34" rx="17" fill="url(#chip)" stroke="#4f7cff" stroke-opacity="0.35"/>
  <text x="445" y="283" fill="#7aa2ff" font-size="13.5" text-anchor="middle">⚡ TUI + tool calling</text>
  <rect x="535" y="260" width="150" height="34" rx="17" fill="url(#chip)" stroke="#4f7cff" stroke-opacity="0.35"/>
  <text x="610" y="283" fill="#7aa2ff" font-size="13.5" text-anchor="middle">🌐 Web member area</text>
  <rect x="700" y="260" width="150" height="34" rx="17" fill="url(#chip)" stroke="#4f7cff" stroke-opacity="0.35"/>
  <text x="775" y="283" fill="#7aa2ff" font-size="13.5" text-anchor="middle">🤖 Bot Telegram</text>

  <text x="640" y="330" fill="#5b6b8f" font-size="13" text-anchor="middle">Termux / Linux · Python 3 · MIT license</text>
</svg>